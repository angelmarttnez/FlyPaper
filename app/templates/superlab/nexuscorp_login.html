<!DOCTYPE html>
<html lang="es">
<head>
{% include 'partials/theme_head.html' %}
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NexusCorp — Portal SSO</title>
<style>
  body {
    font-family: system-ui, sans-serif;
    background: var(--fp-bg, #0f1419);
    color: var(--fp-text, #e8eef5);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
  }
  .card {
    background: rgba(30, 40, 55, 0.95);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 2rem;
    width: 100%;
    max-width: 400px;
  }
  label { display: block; font-size: 13px; margin-top: 0.75rem; }
  input {
    width: 100%;
    padding: 0.5rem;
    margin-top: 0.25rem;
    border-radius: 6px;
    border: 1px solid #4a5d7a;
    background: #1a2332;
    color: #fff;
  }
  button {
    margin-top: 1rem;
    width: 100%;
    padding: 0.55rem;
    background: #3d7ea6;
    border: none;
    color: #fff;
    border-radius: 6px;
    cursor: pointer;
  }
  .error { color: #ff8a8a; margin-top: 0.75rem; font-size: 14px; }
  .aviso { color: #8fd4ff; margin-top: 0.75rem; font-size: 14px; }
  .links { margin-top: 1.25rem; font-size: 13px; }
  .links a { color: #7ec8ff; }
</style>
</head>
<body>
{% include 'partials/superlab_topbar.html' %}
<div class="card">
  <h1 style="font-size:1.15rem;margin:0 0 1rem;">NexusCorp · Acceso corporativo</h1>
  <form method="post" action="{{ url_for('superlab_nexus.nexuscorp_login') }}">
    <label for="usuario">Usuario</label>
    <input id="usuario" name="usuario" type="text" autocomplete="username" required />

    <label for="password">Contraseña provisional</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />

    <button type="submit">Iniciar sesión</button>
  </form>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  {% if aviso %}<p class="aviso">{{ aviso }}</p>{% endif %}
  <p class="links">
    <a href="{{ url_for('superlab_nexus.nexuscorp_home') }}">← Volver al portal</a>
  </p>
</div>
</body>
</html>
