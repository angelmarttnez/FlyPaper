<!DOCTYPE html>
<html lang="es">
<head>
{% include 'partials/theme_head.html' %}
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NexusCorp Legacy 2.0 — Acceso</title>
<style>
  body {
    font-family: Georgia, "Times New Roman", serif;
    background: #ece6d9;
    color: #222;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
  }
  .box {
    background: #fff;
    border: 1px solid #999;
    padding: 2rem 2.5rem;
    width: 100%;
    max-width: 380px;
    box-shadow: 2px 2px 0 #666;
  }
  h1 { font-size: 1.1rem; margin: 0 0 1rem; color: #333; }
  label { display: block; font-size: 0.85rem; margin-top: 0.75rem; }
  input {
    width: 100%;
    padding: 0.4rem;
    margin-top: 0.25rem;
    border: 1px solid #888;
    font-size: 1rem;
  }
  button {
    margin-top: 1.25rem;
    width: 100%;
    padding: 0.5rem;
    background: #336699;
    color: #fff;
    border: none;
    cursor: pointer;
  }
  .error {
    color: #a00;
    font-size: 0.9rem;
    margin-top: 0.75rem;
  }
</style>
</head>
<body>
{% include 'partials/superlab_topbar.html' %}
<!-- TODO: eliminar antes de producción — user: legacy_support / pass: Soporte2019! -->
<div class="box">
  <h1>Portal interno NexusCorp v2.0</h1>
  <form method="post" action="{{ url_for('superlab_legacy.legacy_login_post') }}">
    <label for="usuario">Usuario</label>
    <input id="usuario" name="usuario" type="text" autocomplete="username" required />

    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />

    <button type="submit">Entrar</button>
  </form>
  {% if error %}
  <p class="error">{{ error }}</p>
  {% endif %}
</div>
</body>
</html>
