<!DOCTYPE html>

<html lang="es">

<head>

{% include 'partials/theme_head.html' %}

<meta charset="UTF-8">

<title>Configuración inicial — Panel SOC</title>

<style>

  body { font-family: var(--font-ui); background: var(--bg-base); color: var(--text-main); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }

  .card { max-width: 440px; width: 100%; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 28px; box-shadow: var(--shadow-card); }

  h1 { font-size: 20px; margin-bottom: 8px; }

  p.lead { color: var(--text-muted); font-size: 14px; margin-bottom: 20px; line-height: 1.5; }

  label { display: block; font-size: 13px; margin: 12px 0 6px; color: var(--text-muted); }

  input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-base); color: var(--text-main); }

  button { margin-top: 20px; width: 100%; padding: 12px; border: none; border-radius: 8px; background: var(--color-accent); color: #fff; font-weight: 600; cursor: pointer; }

  .error { background: color-mix(in srgb, var(--color-err) 15%, transparent); color: var(--color-err); padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 12px; }

</style>

</head>

<body class="theme-aware">

  <div class="card">

    <h1>Configuración inicial obligatoria</h1>

    <p class="lead">

      Estás entrando con la cuenta temporal <strong>{{ usuario }}</strong>.

      Define tu <strong>usuario definitivo</strong> y una <strong>contraseña nueva</strong> (mínimo 12 caracteres).

    </p>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form method="post" action="{{ url_for('admin_gestion.cambiar_password_soc_post') }}">

      <input type="hidden" name="csrf_token" value="{{ csrf_token_soc() }}">

      <label for="password_actual">Contraseña actual</label>

      <input type="password" id="password_actual" name="password_actual" required autocomplete="current-password">



      <label for="username_nuevo">Nuevo nombre de usuario SOC</label>

      <input type="text" id="username_nuevo" name="username_nuevo" required minlength="3" maxlength="64" autocomplete="username" placeholder="tu.usuario.soc">



      <label for="password_nueva">Nueva contraseña</label>

      <input type="password" id="password_nueva" name="password_nueva" required minlength="12" autocomplete="new-password">



      <label for="password_confirmacion">Confirmar nueva contraseña</label>

      <input type="password" id="password_confirmacion" name="password_confirmacion" required minlength="12" autocomplete="new-password">



      <button type="submit">Guardar y entrar al panel</button>

    </form>

  </div>

</body>

</html>
